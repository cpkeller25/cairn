services:
  postgres:
      image: postgres:17-alpine
      container_name: cairn-postgres
      environment:
        POSTGRES_USER: cairn
        POSTGRES_PASSWORD: cairn
        POSTGRES_DB: cairn
      ports:
        - "5432:5432"
      volumes:
        - cairn-pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
  cairn-pgdata: